<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>aoilab3D</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{

      --bg:#050816;

      --card:#101827;

      --primary:#00d4ff;

      --secondary:#7c3aed;

      --text:#f8fafc;

      --muted:#94a3b8;

      --border:
      rgba(255,255,255,0.08);

      --gradient:
      linear-gradient(
        135deg,
        #00d4ff 0%,
        #7c3aed 100%
      );
    }

    body{

      font-family:'Inter',sans-serif;

      background:
      radial-gradient(
        circle at top,
        #0f172a 0%,
        #050816 70%
      );

      color:var(--text);

      overflow-x:hidden;
    }

    header{

      position:sticky;

      top:0;

      z-index:999;

      backdrop-filter:blur(10px);

      background:
      rgba(5,8,22,0.7);

      border-bottom:
      1px solid var(--border);
    }

    .navbar{

      max-width:1400px;

      margin:auto;

      padding:18px 24px;

      display:flex;

      align-items:center;

      justify-content:space-between;
    }

    .logo{

      display:flex;

      align-items:center;

      gap:14px;
    }

    .logo-icon{

      width:48px;

      height:48px;

      border-radius:14px;

      background:var(--gradient);

      display:flex;

      align-items:center;

      justify-content:center;

      font-weight:800;
    }

    .logo h1{

      font-size:1.2rem;
    }

    .logo span{

      color:var(--primary);
    }

    .hero{

      max-width:1400px;

      margin:auto;

      padding:
      90px 24px 70px;

      display:grid;

      grid-template-columns:
      1fr 1fr;

      gap:60px;

      align-items:center;
    }

    .hero h2{

      font-size:4rem;

      line-height:1.05;

      margin-bottom:24px;

      font-weight:800;
    }

    .hero h2 span{

      background:var(--gradient);

      -webkit-background-clip:text;

      -webkit-text-fill-color:transparent;
    }

    .hero p{

      color:var(--muted);

      line-height:1.8;

      margin-bottom:30px;

      max-width:620px;
    }

    .btn{

      border:none;

      cursor:pointer;

      padding:14px 24px;

      border-radius:14px;

      font-weight:700;

      background:var(--gradient);

      color:white;
    }

    .hero-visual{

      position:relative;

      display:flex;

      align-items:center;

      justify-content:center;
    }

    .orb{

      position:absolute;

      width:420px;

      height:420px;

      border-radius:50%;

      background:
      radial-gradient(
        circle,
        rgba(0,212,255,0.35),
        transparent 70%
      );

      filter:blur(25px);

      animation:
      float 6s ease-in-out infinite;
    }

    .cube{

      width:260px;

      height:260px;

      border-radius:32px;

      background:
      linear-gradient(
        145deg,
        #172036,
        #0f172a
      );

      border:
      1px solid rgba(255,255,255,0.08);

      transform:rotate(16deg);

      display:flex;

      align-items:center;

      justify-content:center;
    }

    .cube::before{

      content:"3D";

      font-size:5rem;

      font-weight:900;

      background:var(--gradient);

      -webkit-background-clip:text;

      -webkit-text-fill-color:transparent;
    }

    @keyframes float{

      0%,100%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-18px);
      }
    }

    .section{

      max-width:1400px;

      margin:auto;

      padding:40px 24px 80px;
    }

    .section-title{

      margin-bottom:40px;
    }

    .section-title h3{

      font-size:2.2rem;

      margin-bottom:12px;
    }

    .catalog-grid{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(340px,1fr));

      gap:28px;
    }

    .card{

      background:
      rgba(15,23,42,0.9);

      border:
      1px solid var(--border);

      border-radius:24px;

      overflow:hidden;

      transition:0.3s;
    }

    .card:hover{

      transform:translateY(-6px);

      border-color:
      rgba(0,212,255,0.25);
    }

    .viewer{

      width:100%;

      height:320px;

      background:#050816;
    }

    .card-content{

      padding:24px;
    }

    .product-code{

      color:var(--primary);

      font-size:0.85rem;

      font-weight:700;

      margin-bottom:10px;
    }

    .product-name{

      font-size:1.4rem;

      font-weight:700;

      margin-bottom:14px;
    }

    .description{

      color:var(--muted);

      line-height:1.7;

      margin-bottom:24px;
    }

    .footer-card{

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:16px;
    }

    .price{

      font-size:1.6rem;

      font-weight:800;
    }

    .whatsapp-btn{

      border:none;

      cursor:pointer;

      padding:12px 18px;

      border-radius:14px;

      font-weight:700;

      background:var(--gradient);

      color:white;

      transition:0.3s;
    }

    .whatsapp-btn:hover{

      transform:scale(1.03);
    }

    footer{

      margin-top:80px;

      border-top:
      1px solid var(--border);

      padding:40px 24px;

      text-align:center;

      color:var(--muted);
    }

    @media(max-width:980px){

      .hero{

        grid-template-columns:1fr;

        text-align:center;
      }

      .hero p{

        margin:auto auto 30px;
      }

      .hero h2{

        font-size:3rem;
      }
    }

  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

</head>

<body>

<header>

  <nav class="navbar">

    <div class="logo">

      <div class="logo-icon">
        A3D
      </div>

      <h1>
        aoi<span>lab3D</span>
      </h1>

    </div>

  </nav>

</header>

<section class="hero">

  <div>

    <h2>

      Modelos digitais
      <span>3D</span>

    </h2>

    <p>

      Catálogo moderno de modelos
      digitais para impressão 3D.

    </p>

    <a href="#catalogo">

      <button class="btn">
        Ver Catálogo
      </button>

    </a>

  </div>

  <div class="hero-visual">

    <div class="orb"></div>

    <div class="cube"></div>

  </div>

</section>

<section
  class="section"
  id="catalogo"
>

  <div class="section-title">

    <h3>
      Catálogo
    </h3>

  </div>

  <div
    class="catalog-grid"
    id="productGrid"
  ></div>

</section>

<footer>

  © 2026 aoilab3D

</footer>

<script type="module">

import * as THREE from 'three';

import { OrbitControls }
from 'three/addons/controls/OrbitControls.js';

import { GLTFLoader }
from 'three/addons/loaders/GLTFLoader.js';

// PRODUTOS

const products = [

  {

    code:"A3D-001",

    name:"Peixe",

    description:
    "Modelo 3D de peixe.",

    price:"R$ 29,90",

    file:"assets/peixe.glb"

  },

  {

    code:"A3D-002",

    name:"Shark",

    description:
    "Modelo 3D de tubarão.",

    price:"R$ 45,00",

    file:"assets/shark.glb"

  }

];

const grid =
document.getElementById("productGrid");

// CRIA CARDS

products.forEach((product,index)=>{

  const card =
  document.createElement("div");

  card.className = "card";

  card.innerHTML = `

    <div
      class="viewer"
      id="viewer-${index}">
    </div>

    <div class="card-content">

      <div class="product-code">
        ${product.code}
      </div>

      <div class="product-name">
        ${product.name}
      </div>

      <div class="description">
        ${product.description}
      </div>

      <div class="footer-card">

        <div class="price">
          ${product.price}
        </div>

        <a
          href="https://wa.me/5516992401080?text=${encodeURIComponent(

`Olá! Tudo bem?

Estou interessado no modelo:

Código: ${product.code}
Nome: ${product.name}
Descrição: ${product.description}
Valor: ${product.price}`

          )}"
          target="_blank"
        >

          <button class="whatsapp-btn">
            WhatsApp
          </button>

        </a>

      </div>

    </div>

  `;

  grid.appendChild(card);

  createViewer(
    `viewer-${index}`,
    product.file
  );

});

// VIEWER THREEJS

function createViewer(
  containerId,
  modelFile
){

  const container =
  document.getElementById(containerId);

  // SCENE

  const scene =
  new THREE.Scene();

  scene.background =
  new THREE.Color(0x050816);

  // CAMERA

  const camera =
  new THREE.PerspectiveCamera(
    35,
    1,
    0.01,
    1000
  );

  // RENDERER

  const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
  });

  renderer.setPixelRatio(
    window.devicePixelRatio
  );

  container.appendChild(
    renderer.domElement
  );

  // CONTROLS

  const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;

  controls.enablePan = false;

  controls.autoRotate = true;

  controls.autoRotateSpeed = 1.5;

  // LIGHTS

  const ambientLight =
  new THREE.AmbientLight(
    0xffffff,
    2.5
  );

  scene.add(ambientLight);

  const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

  directionalLight.position.set(
    5,
    5,
    5
  );

  scene.add(directionalLight);

  // PIVOT

  const pivot =
  new THREE.Group();

  scene.add(pivot);

  // MODEL

  let model = null;

  // RESIZE

  function resizeRenderer(){

    const width =
    container.clientWidth;

    const height =
    container.clientHeight;

    renderer.setSize(
      width,
      height
    );

    camera.aspect =
    width / height;

    camera.updateProjectionMatrix();

  }

  resizeRenderer();

  // OBSERVER

  const resizeObserver =
  new ResizeObserver(()=>{

    resizeRenderer();

  });

  resizeObserver.observe(container);

  // LOADER

  const loader =
  new GLTFLoader();

  loader.load(

    modelFile,

    function(gltf){

      model = gltf.scene;

      pivot.add(model);

      // BOX

      const box =
      new THREE.Box3()
      .setFromObject(model);

      // SPHERE

      const sphere =
      box.getBoundingSphere(
        new THREE.Sphere()
      );

      const center =
      sphere.center;

      const radius =
      sphere.radius;

      // CENTRALIZA

      model.position.x -= center.x;
      model.position.y -= center.y;
      model.position.z -= center.z;

      // CAMERA DISTANCE

      const fov =
      camera.fov *
      (Math.PI / 180);

      let distance =
      radius /
      Math.sin(fov / 2);

      // APROXIMA MAIS

      distance *= 0.80;

      camera.position.set(
        0,
        0,
        distance
      );

      // CONTROLS

      controls.target.set(
        0,
        0,
        0
      );

      controls.minDistance =
      radius * 1.2;

      controls.maxDistance =
      radius * 5;

      controls.update();

      // SOMBRAS

      model.traverse((child)=>{

        if(child.isMesh){

          child.castShadow = true;

          child.receiveShadow = true;

        }

      });

    },

    undefined,

    function(error){

      console.error(
        "Erro ao carregar:",
        error
      );

    }

  );

  // ANIMATION

  function animate(){

    requestAnimationFrame(
      animate
    );

    controls.update();

    renderer.render(
      scene,
      camera
    );

  }

  animate();

}
</script>

</body>

</html>
